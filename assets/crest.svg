<!--
  The Restructuring Brief — crest.
  Per pale: scales on the dexter side (law), a descending waterfall of bars on
  the sinister (finance), a gold pale between them for the table.
  Canonical asset. Rendered into the PDF masthead by templates/issue.typ and
  copied to docs/assets/ for the website by pipeline/render_site.py.
-->
