conditions: >
  Spreads gave back the whole of September in seven sessions. The high-yield
  index closed 1 October at 324 basis points, 58 wider than the 266 reported
  here two weeks ago; the CCC tier went from 1,077 to 1,215. Issue 1
  called distress idiosyncratic rather than systemic, and this does not overturn
  it. The ratio of CCC to the index fell from 4.05 to 3.75, so the index widened
  proportionally more than its worst tier, which is not what a default scare
  looks like. These are spreads over treasuries, so the widening is a credit
  move in its own right, even as the ten-year rose to 5.24%. The repricing is
  broad and shallow.

