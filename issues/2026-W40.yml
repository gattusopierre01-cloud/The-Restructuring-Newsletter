headlines:
  - Brightline's holding companies filed for Chapter 11 in New Jersey with
    $2.5bn of debt, leaving the Miami to Orlando railway itself outside it.
  - Leslie's filed a prearranged Chapter 11 in Houston to shed about $685m,
    ninety per cent of its funded debt, handing ownership to its lenders.
  - The Court of Appeal overturned a finding of dishonest assistance against a
    solicitor, holding that negligence is not blind-eye knowledge.

# ---------------------------------------------------------------------------
# Situation of the week
# ---------------------------------------------------------------------------
featured:
  jurisdiction: US
  name: Brightline (FIHPNP LLC and affiliates)
  kind: Chapter 11 — holding companies only
  stage: filed
  venue: D.N.J., filed 24 September 2026
  debt: c. $2.5bn at the filing entities, c. $7.1bn across the group
  parties: >
    RSA with Assured Guaranty and an ad hoc group of Nuveen, First Eagle,
    Invesco and Nomura
  body: >
    Seventeen entities above Brightline's Florida railway filed for Chapter 11
    in New Jersey on 24 September. The railway did not. Brightline Trains
    Florida LLC, which owns the track and runs the trains between Miami and
    Orlando, stayed out of the case and kept operating, and its roughly $2.2bn
    of bonds were untouched by the filing.

    That is the whole point of the structure, and it is worth sitting with. A
    holding company owns nothing but shares in the company beneath it. Shares
    rank behind that company's own creditors. So when the group could not
    service everything, the debt that could be restructured was the debt sitting
    where there were no operating creditors to protect, about $2.5bn of parent
    notes and credit facilities, while the bonds secured on the railway itself
    carried on being paid.

    The restructuring support agreement binds Assured Guaranty, which insures
    much of the paper, and an ad hoc group of mutual funds: Nuveen, First Eagle,
    Invesco and Nomura. It commits $490m of new long-term money. The $257.7m
    debtor-in-possession facility is borrowed not by the debtors but by the
    non-debtor operating company, with the filed entities as limited guarantors,
    an inversion of the usual arrangement and a reminder that the cash is
    where the trains are.

    Not everyone signed. Brightline East's $1.12bn of senior secured notes sit
    outside the agreement, which is where the next fight is.
  source:
    title: Case summary — Bondoro
    url: https://bondoro.com/brightline/

