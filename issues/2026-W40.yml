feature:
  title: Escalator up, elevator down
  stats_after: 3
  body: >
    Markets take the escalator up and the elevator down, as the saying goes.
    The artificial intelligence buildout has spent two years on the escalator,
    and it is worth asking what the elevator would look like.

    Start with one fact. Meta has
    financed two data centre campuses through the same structure, nine months
    apart. Hyperion, Louisiana, October 2025: $27.294bn of senior secured notes
    through Beignet Investor LLC, 80 per cent owned by Blue Owl funds, at 6.581
    per cent, 225 basis points over treasuries, rated A+. El
    Paso, July 2026: $12.547bn through Sopaipilla Investor LLC, 80 per cent
    owned by BlackRock funds, at 7.534 per cent, 287.5 over.

    Same sponsor. Same template. Same rating band. Sixty-two and a half basis
    points.

    Two features make this a restructuring story. The
    first is duration. Beignet is a bond with 23.6 years to run, and the assets
    inside the buildings it financed do not last that long. Jim Chanos puts the
    economic life of the chips nearer three years than the eight or ten over
    which they are depreciated. The International Monetary Fund named the same
    problem in July: a maturity mismatch between the physical assets and the
    debt.

    The second is location. Beignet and Sopaipilla sit off Meta's balance sheet,
    supported by residual value guarantees rather than Meta's own credit.
    Nvidia's $105bn arrangement at the Ohio campus leased to OpenAI guarantees
    the residual value of the buildings rather than the rent, and only on
    OpenAI's insolvency. These are the documents that decide who is a creditor
    of whom.

    The case against alarm is substantive. JPMorgan Asset Management wrote in
    August that the issuance does not cause a credit crisis, and that
    hyperscaler balance sheets remain among the strongest in the
    index. Marc Rowan of Apollo draws the distinction that matters. With
    one of the large technology companies as your offtake provider, he told a
    conference in September, you can finance the project as though you were
    financing that company. Asked to fund a merchant project resting on assumed
    utilisation and renewal rates, he said, "I don't know how you do that."

    There is also reason to doubt the elevator. Stefan Hepp of Chicago Booth
    argued in August that losses here would arrive as a sequence of financing
    events rather than one crisis, which is what a chain of staggered
    maturities produces. No single refinancing is large
    enough to be the moment. Which is worse in one respect: you notice an
    elevator.

