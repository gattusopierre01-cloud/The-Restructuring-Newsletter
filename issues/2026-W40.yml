    debt: c. $760m of funded debt, about $685m to be eliminated
    parties: Nasdaq-listed; RSA signed by over 80% of existing lenders
    notable: >
      The largest pool supplies retailer in the United States is handing itself
      to its lenders. Adjusted EBITDA fell from $292m to $61m in three years,
      and the plan writes off ninety per cent of funded debt in exchange for
      the equity, with $90m of debtor-in-possession money, a $225m asset-based
      facility and $60m of new equity backstopped by the supporting lenders.
      Seventy-six stores close; more than nine hundred stay open. Emergence is
      targeted for early 2027.
    source:
      title: Announcement of the restructuring — Leslie's
      url: https://www.financialcontent.com/article/bizwire-2026-9-30-leslies-announces-strategic-transaction-to-strengthen-financial-foundation-and-position-the-company-for-the-future

