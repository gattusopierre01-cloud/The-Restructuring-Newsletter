# ---------------------------------------------------------------------------
# Case notes — UK and US only
# ---------------------------------------------------------------------------
cases:
  - jurisdiction: UK
    name: Grosvenor Property Developers Ltd (in liquidation) v Partner Law Ltd
    citation: "[2026] EWCA Civ 1238"
    court: Court of Appeal (Civil Division)
    judge: Falk LJ, with Nugee and Phillips LJJ
    date: 2026-10-02
    bottom_line: >
      A solicitor who failed to ask obvious questions was negligent, not
      dishonest. Blind-eye knowledge needs a targeted suspicion and a conscious
      decision not to confirm it. The finding of dishonest assistance was
      overturned.
    facts: >
      Grosvenor raised money from investors for a property development. Its
      directors misappropriated around £7m and the company collapsed. The
      liquidators sued the solicitors who had handled three transactions
      involving £2.399m of that money, alleging that the partner concerned had
      dishonestly assisted the directors' breaches of fiduciary duty.
    question: >
      Can a solicitor be fixed with blind-eye knowledge, and so with
      dishonesty, on findings that amount to a failure to make obvious
      enquiries?
    holding: >
      Appeal allowed. Dishonesty is a two-stage test and the judge had
      collapsed it into one by asking what an honest solicitor would have done.
      Blind-eye knowledge requires a suspicion of specific facts and a deliberate
      decision not to confirm them; the judge found neither. There was no
      finding that the partner refrained from asking questions for fear of the
      answer. His conduct was consistent with negligence.
    why_it_matters: >
      Claims against professional advisers are a standard route for liquidators
      with an empty estate and a fraud behind them, because the adviser has
      insurance and the directors do not. This raises the bar: shortcomings in
      the file, however serious, are not a shortcut to accessory liability, and
      a case built on what a competent solicitor should have noticed is a
      negligence case.
    background: >
      A stranger to a trust who helps a fiduciary breach it can be liable for
      the loss. That is dishonest assistance. The help need not be dishonest in itself;
      the assistant's state of mind must be. Courts allow blind-eye knowledge to
      stand in for actual knowledge, but narrowly: deliberately not looking,
      rather than carelessly not seeing. The distinction decides whether a claim
      sounds in negligence, with its defences and its insurance, or in equity.
    source:
      title: Approved judgment — Find Case Law
      url: https://caselaw.nationalarchives.gov.uk/ewca/civ/2026/1238

# ---------------------------------------------------------------------------
# Both sides of the table
# ---------------------------------------------------------------------------
concepts:
  pairing: >
    The doctrine and the price are one sentence. Structural subordination is
    why holdco paper yields more, and the extra yield is what being
    structurally subordinate costs.
  law:
    term: Structural subordination
    body: >
      A lender to a holding company ranks behind the lenders to the company
      below it, whatever the two sets of documents say, because the holding
      company's only asset is shares, and shares are what is left after the
      operating company's own creditors are paid. Nothing subordinates the
      holdco lender; the corporate structure does it for them. This is why a
      group can put its parents into Chapter 11 and leave the operating company
      out, as Brightline has: the parents' creditors have no direct claim on the
      assets, so restructuring them does not disturb the people who do.
    see_also:
      - separate legal personality
      - upstream guarantee
      - substantive consolidation
  finance:
    term: The holdco-opco spread
    body: >
      Two bonds, one group, different prices. Holdco paper trades wider than
      opco paper because it is paid later, from whatever flows up, and in a bad
      outcome it is paid not at all. The gap between the two yields is the
      market pricing one structural fact: distance from the assets. Brightline's
      railway bonds were untouched while $2.5bn above them went into Chapter 11,
      which is the gap being realised rather than merely quoted. Anyone holding
      holdco paper was paid for precisely that risk beforehand.
    see_also:
      - subordination
      - fulcrum security
      - cash leakage

