conditions: >
  The high-yield index sits at 268 basis points over treasuries, three tighter
  over the week and close to its post-pandemic lows. The CCC and lower tier is
  at 1,077, roughly four times the index. That gap is the picture: money is
  available on easy terms to anything with a story, and priced for failure at
  the bottom. It explains the week. Arxada pushed its maturities out three
  years with no creditor voting against, which is what an amend-and-extend
  looks like when refinancing markets are open. airBaltic raised €350m of new
  money while filing for bankruptcy. Neither is a company caught in a credit
  cycle; both are specific problems in a market otherwise lending freely.
  Distress, for now, is idiosyncratic rather than systemic.

