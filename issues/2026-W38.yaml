    kind: Scheme of arrangement (Part 26)
    stage: completed
    venue: High Court of England and Wales, sanctioned 15 September 2026
    debt: €1.119bn and $1.362bn term loans, a €430m RCF, and senior notes
    parties: Rajah J sanctioned; no creditor opposed
    notable: >
      A Swiss specialty chemicals group used an English scheme to push its
      maturities out by three years, adding payment-in-kind margins while
      keeping cash coupons, with a CHF 200m sponsor contribution alongside.
      Turnout was 82% in the senior secured class and 96% among noteholders,
      and every creditor who voted supported it. No judgment has been published.
    source:
