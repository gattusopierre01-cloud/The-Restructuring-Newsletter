# Issue 1 — the first issue built from real developments.
#
# Period runs 14–21 September rather than 14–20. The seven days to Sunday
# produced no published UK or US restructuring judgment; the most significant
# decision of the period, Trower J in Glencore v Prax Lindsey, was handed down
# on the Monday. Carrying it rather than holding it a week is the call made
# here. See the cadence note in the covering message.

issue: 1
slug: 2026-W38
status: published

date_published: 2026-09-23
period_start: 2026-09-14
period_end: 2026-09-21

headlines:
  - airBaltic, 88% owned by the Latvian state, filed for Chapter 11 in New York
    with €350m of new financing committed behind it.
  - Arxada's English scheme of arrangement was sanctioned without opposition,
    extending its term loans and notes by three years.
  - A Belo Horizonte court ratified Andrade Gutierrez's out-of-court plan,
    binding creditors for the second time in four years.

# ---------------------------------------------------------------------------
# Situation of the week
# ---------------------------------------------------------------------------
featured:
  jurisdiction: LV
  name: Air Baltic Corporation AS
  kind: Chapter 11
  stage: filed
  venue: S.D.N.Y., filed 14 September 2026
  debt: Assets and liabilities each stated at $1–10bn
  parties: Latvian state 88.37%, Lufthansa Group c. 10%
  body: >
    Latvia's flag carrier filed for Chapter 11 in Manhattan on 14 September,
    together with its training and cargo subsidiaries. The airline is not
    American. It is 88% owned by the Latvian state, flies a fleet built around
    the Airbus A220, and its operations sit squarely in the Baltics. It filed in
    New York anyway.

    The pressures are the familiar post-pandemic ones compounded by an engine
    problem: Pratt & Whitney geared turbofan groundings, higher fuel costs, war
    on the eastern border, and a €70m net loss in the first quarter of 2026. Its
    2029 bonds tell the story — quoted in the mid-90s in January, low 20s by
    August.

    What makes the filing worth attention is the money that came with it. A €350m
    superpriority term loan, arranged by Strategic Value Partners with Barclays
    Bank Ireland, Hayfin and Oaktree alongside, priced at SOFR plus 800 with a 5%
    upfront fee. The Latvian state authorised up to €30m of interim financing of
    its own. The plan contemplates handing back around twenty surplus aircraft,
    taking the fleet from 54 to the high thirties, and €45m of annual cost
    savings, with completion targeted for June 2027.

    The question the case raises is the one this newsletter exists for: why New
    York? The answer is in this week's concepts.
  source:
    title: Case summary and docket detail — Bondoro
    url: https://bondoro.com/air-baltic/

