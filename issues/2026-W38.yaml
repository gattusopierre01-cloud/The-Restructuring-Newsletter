  - jurisdiction: BR
    name: Andrade Gutierrez Engenharia
    kind: Recuperação extrajudicial
    stage: completed
    venue: Belo Horizonte, ratified 18 September 2026
    debt: c. R$3.4bn (about $660m) at the main operating company
    parties: Vert, a securitisation firm, holds c. 71% of claims
    notable: >
      Brazil's out-of-court recovery process lets a plan agreed with a majority
      be ratified by the court and imposed on the rest. Creditors choose between
      a 36% payout on schedule, full principal deferred to 2070, or a split of
      the two. It is the group's second restructuring in four years.
    source:
      title: Andrade Gutierrez restructuring approved — The Rio Times
      url: https://www.riotimesonline.com/andrade-gutierrez-restructuring-approved-2026/

# ---------------------------------------------------------------------------
# Case notes — UK and US only
# ---------------------------------------------------------------------------
cases:
  - jurisdiction: UK
    name: Glencore Energy UK Ltd v Prax Lindsey Oil Refinery Ltd (in liquidation)
    citation: "[2026] EWHC 2394 (Ch)"
    court: High Court, Insolvency and Companies List
    judge: Trower J
    date: 2026-09-21
    bottom_line: >
      The right to rescind a contract for fraud survives the counterparty's
      liquidation. It binds the property transferred, so it is not swept into
      the pari passu distribution. Crown Holdings is not followed.
    facts: >
      Prax Lindsey ran a major UK refinery and went into compulsory liquidation
      in June 2025 after a fraud by its sole director, involving fictitious
      invoices exceeding £334m. Glencore sought permission to rescind five crude
      supply contracts worth over $230m, induced, it said, by misrepresentations
      about the refinery's finances.
    question: >
      Does an equity to rescind for fraudulent misrepresentation survive a
      company's liquidation, or is it extinguished by the statutory trust over
      the company's assets?
    holding: >
      Leave to proceed granted. The equity is an inherent limitation on the title
      the company acquired, not a personal claim against it: the property passed
      subject to the equity and remained so. The statutory scheme in section 107
      assumes assets come to the liquidator unencumbered, and here they did not.
      The reasoning in Crown Holdings was rejected.
    why_it_matters: >
      A defrauded counterparty may recover the asset itself rather than prove as
      an unsecured creditor for its value. For liquidators it means assets
      acquired before the winding up cannot be assumed clean. Given it departs
      from a High Court decision, an appeal would not be surprising.
    background: >
      When a contract is induced by fraud the innocent party may rescind, undoing
      the transfer. That is an equity: not a debt owed, but a flaw in the other
      side's title. On a winding up, section 107 of the Insolvency Act 1986
      requires assets to be shared rateably among unsecured creditors — pari
      passu. The question is whether an equity that predates the liquidation
      sits outside that pool or falls into it.
    source:
      title: Approved judgment — Find Case Law
      url: https://caselaw.nationalarchives.gov.uk/ewhc/ch/2026/2394

# ---------------------------------------------------------------------------
# Both sides of the table
# ---------------------------------------------------------------------------
concepts:
  pairing: >
    Eligibility opens the door to a New York courtroom. The superpriority loan
    is what makes walking through it worth doing.
  law:
    term: Section 109(a) eligibility
    body: >
      A company does not need to be American to be a Chapter 11 debtor. Section
      109(a) of the Bankruptcy Code requires only that it reside, or have a
      domicile, a place of business, or property in the United States. Courts
      have read "property" generously: a bank account, or a retainer paid to US
      counsel, has been enough. That is why a Latvian airline, or a Swiss
      chemicals group, can restructure in Manhattan. The attraction is not the
      courtroom but the toolkit — the automatic stay reaching worldwide, the
      ability to reject leases, and a financing market that will lend to a
      company already in bankruptcy.
    see_also: [Chapter 15, COMI, forum shopping, automatic stay]
  finance:
    term: Debtor-in-possession financing
    body: >
      New money lent to a company after it files, and the reason a bankrupt
      borrower can still raise several hundred million. The lender is protected
      by statute: a superpriority claim ranking ahead of existing unsecured
      creditors, and usually a lien priming existing security. That priority,
      not the borrower's condition, is what is being priced — which is how
      airBaltic's €350m came at SOFR plus 800 with a 5% upfront fee, expensive
      in absolute terms but secured against the front of the queue. DIP lenders
      also tend to end up owning the reorganised company, so the loan is often
      the first move in a bid for control.
    see_also: [superpriority, priming lien, roll-up, exit financing]

