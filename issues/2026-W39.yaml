headlines:
  - The Court of Appeal's judgment in Adler remains the reference point for how
    an English restructuring plan may depart from pari passu treatment.
  - Purdue closed off nonconsensual third-party releases in Chapter 11, pushing
    mass-tort debtors towards consent mechanics and opt-outs.
  - Cineworld remains the worked example of a UK-listed group restructuring
    through Chapter 11 in Texas rather than at home.

# ---------------------------------------------------------------------------
# Situation of the week — one matter explained properly
# ---------------------------------------------------------------------------
featured:
  jurisdiction: DE
  name: Adler Group / AGPS BondCo plc
  kind: Restructuring plan (Part 26A)
  stage: completed
  venue: High Court of England and Wales, then the Court of Appeal
  debt: c. €6.1bn of senior unsecured notes in six series
  parties: An ad hoc group of 2029 noteholders opposed the plan
  body: >
    Adler is a German real estate group that borrowed in the European
    high-yield market through six series of senior unsecured notes maturing
    between 2024 and 2029. The notes ranked equally with one another. When the
    group ran short of liquidity it did not restructure in Germany, where it
    operates, but in London, using a Part 26A restructuring plan through an
    English-incorporated issuer. The plan extended maturities, and it did so in
    the order the notes already fell due: the 2024 holders were repaid first,
    the 2029 holders last. For creditors ranking equally that is a meaningful
    difference. Holders further out bore more of the risk that the money would
    run out before their turn came. The 2029 group voted against and challenged
    the sanction order. The judge at first instance sanctioned the plan; the
    Court of Appeal set it aside, holding that the differential treatment
    between equal-ranking creditors had not been justified. What makes the
    matter worth revisiting is that nothing turned on the size of the debt. It
    turned on the shape of the plan — which creditors were asked to wait, and
    whether anyone had explained why.
  source:
    title: Judgment — Re AGPS BondCo plc [2024] EWCA Civ 24
    url: https://www.judiciary.uk/wp-content/uploads/2024/01/Adler-Approved-Judgment-for-circulation.pdf

