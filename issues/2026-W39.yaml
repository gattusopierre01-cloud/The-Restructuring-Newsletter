  - jurisdiction: US
    name: Cineworld Group plc
    kind: Chapter 11
    stage: completed
    venue: S.D. Tex. (filed 7 September 2022)
    debt: c. $4.5bn of debt eliminated under the plan
    parties: Secured lenders took the equity; shareholders received nothing
    notable: >
      A UK-listed group with a large US cinema business restructured in Texas
