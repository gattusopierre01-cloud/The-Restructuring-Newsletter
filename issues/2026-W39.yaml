headlines:
  - The Court of Appeal's judgment in Adler remains the reference point for how
    an English restructuring plan may depart from pari passu treatment.
  - Purdue closed off nonconsensual third-party releases in Chapter 11, pushing
    mass-tort debtors towards consent mechanics and opt-outs.
  - Cineworld remains the worked example of a UK-listed group restructuring
    through Chapter 11 in Texas rather than at home.

deals:
  - jurisdiction: UK
    name: Adler Group / AGPS BondCo plc
    kind: Restructuring plan (Part 26A)
    venue: High Court, then Court of Appeal
    debt: c. €6.1bn of senior unsecured notes
    parties: Six series of notes maturing 2024–2029; an ad hoc group of holders opposed
    notable: >
      The plan extended maturities in the order the notes already fell due, so
      the 2024 holders were repaid first and the 2029 holders last. The Court of
      Appeal held that this departure from pari passu treatment had not been
      justified and set the sanction order aside. The structure, not the
      quantum, is what made it significant.
    source:
      title: Judgment — Re AGPS BondCo plc [2024] EWCA Civ 24
      url: https://www.judiciary.uk/wp-content/uploads/2024/01/Adler-Approved-Judgment-for-circulation.pdf

  - jurisdiction: US
    name: Purdue Pharma L.P.
    kind: Chapter 11
    venue: S.D.N.Y., then the Supreme Court
    debt: Plan valued at c. $6bn in Sackler family contributions
    parties: Opioid claimants, state attorneys general, the US Trustee
    notable: >
      The plan released claims against the Sackler family, who had not
      themselves filed for bankruptcy, without the consent of every claimant.
      The Supreme Court held the Bankruptcy Code does not authorise that. A
      consensual plan was later confirmed on different mechanics.
    source:
      title: Opinion — Harrington v. Purdue Pharma L.P., 603 U.S. 204 (2024)
      url: https://supreme.justia.com/cases/federal/us/603/23-124/

  - jurisdiction: US
    name: Cineworld Group plc
    kind: Chapter 11
    venue: S.D. Tex. (filed 7 September 2022)
    debt: c. $4.5bn of debt eliminated under the plan
    parties: Secured lenders took the equity; existing shareholders received nothing
    notable: >
      A UK-listed group with a large US cinema business (Regal) restructured in
      Texas rather than through an English plan or scheme. It is the standard
      illustration of forum choice driven by where the operations and the
      lenders sit. The group emerged in August 2023 and later delisted.
    source:
      title: Case docket — Cineworld Group plc, Kroll Restructuring Administration
      url: https://cases.ra.kroll.com/cineworld/

cases:
  - jurisdiction: UK
    name: Re AGPS BondCo plc (Adler)
    citation: "[2024] EWCA Civ 24"
    court: Court of Appeal (Civil Division)
    judge: Snowden LJ
    date: 2024-01-23
    bottom_line: >
      A restructuring plan may cram down a dissenting class, but the court will
      look hard at how value is shared between creditors of the same rank. An
      unexplained departure from pari passu treatment will not be sanctioned.
    facts: >
      Adler Group, a German real estate group, used an English Part 26A plan to
      extend the maturities of six series of senior unsecured notes. The notes
      ranked equally, but the plan paid them out in maturity order. Holders of
      the 2029 notes voted against and challenged the sanction order.
    question: >
      Where creditors of the same rank are treated differently under a
      restructuring plan, how should the court exercise its discretion to
      sanction it over a dissenting class?
    holding: >
      The appeal was allowed and the sanction order set aside. The relevant
      comparison is not only whether dissenting creditors do better than in the
      relevant alternative — the vertical comparison — but also how the plan
      divides value between creditors of equal rank, the horizontal comparison.
      Departure from pari passu is possible but must be positively justified.
    why_it_matters: >
      It set the framework English courts now apply to cross-class cram-down and
      made plan design, not just plan economics, a litigable question. Sponsors
      structuring differential treatment between equal-ranking creditors have to
      be able to explain why.
    background: >
      A restructuring plan under Part 26A of the Companies Act 2006 lets a
      company bind a dissenting class of creditors, which a scheme of arrangement
      cannot do. That power is called cross-class cram-down. Pari passu is the
      principle that creditors of the same rank share rateably. Adler is about
      the tension between the two.
    source:
      title: Approved judgment (judiciary.uk)
      url: https://www.judiciary.uk/wp-content/uploads/2024/01/Adler-Approved-Judgment-for-circulation.pdf

  - jurisdiction: US
    name: Harrington v. Purdue Pharma L.P.
    citation: 603 U.S. 204 (2024), No. 23-124
    court: Supreme Court of the United States
    judge: Gorsuch J (5–4; Kavanaugh J dissenting)
    date: 2024-06-27
    bottom_line: >
      A Chapter 11 plan cannot release claims against a non-debtor without the
      consent of the claimant. The catch-all in section 1123(b)(6) does not
      supply the power.
    facts: >
      Purdue's plan channelled opioid claims and, in exchange for around $6bn
      from the Sackler family, released claims against family members who had
      not filed for bankruptcy themselves. The US Trustee objected. The Second
      Circuit had approved the releases.
    question: >
      Does the Bankruptcy Code authorise a plan to extinguish claims held by
      non-consenting third parties against a non-debtor?
    holding: >
      Reversed. Section 1123(b)(6) permits provisions "not inconsistent with"
      the Code, read alongside the specific powers listed before it; it is not a
      grant of open-ended authority. Discharge is for debtors who put their
      assets on the table, and the Sacklers had not. Consensual releases and
      the treatment of already-confirmed plans were expressly left open.
    why_it_matters: >
      Nonconsensual third-party releases had become standard in mass-tort
      Chapter 11 plans. Practice has moved to opt-in and opt-out consent
      mechanics, and the boundary of what counts as consent is where the
      litigation now sits.
    background: >
      A third-party release wipes out a claim one creditor has against another
      party, usually a director, shareholder or insurer, as part of the debtor's
      plan. It is attractive because those parties will often only fund a plan
      if they are protected. It is contentious because the released party has
      not itself gone through bankruptcy.
    source:
      title: Opinion (Justia)
      url: https://supreme.justia.com/cases/federal/us/603/23-124/

concept:
  term: Cross-class cram-down
  body: >
    Cram-down is the court's power to impose a restructuring on a class of
    creditors that voted against it. In England it arrived with Part 26A of the
    Companies Act 2006 in 2020 and is the main thing a restructuring plan can do
    that a scheme of arrangement cannot: under a scheme, every class has a veto.
    Two conditions must be met. First, no member of the dissenting class may be
    worse off than they would be in the relevant alternative — usually
    administration or liquidation — which is the vertical comparison. Second, at
    least one class that would receive a payment in that alternative must have
    voted in favour, so someone with real money at stake supports the plan.
    Meeting both conditions does not entitle a company to sanction. The court
    still has a discretion, and Adler is where the Court of Appeal explained how
    it is exercised: the judge also looks horizontally, at how the plan divides
    value between creditors of the same rank.
  see_also: [pari passu, relevant alternative, restructuring plan, scheme of arrangement]

