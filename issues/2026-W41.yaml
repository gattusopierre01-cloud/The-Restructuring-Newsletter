      The liquidators are pursuing HK$18.65bn from Cheung Chung Kiu, chairman of
      C C Land, and HK$500m from Kai Johan Jiang. Two days later Cheung issued
      his own writ against the founder, Hui Ka Yan, claiming HK$10.1bn of unpaid
