# ---------------------------------------------------------------------------
# Case notes — UK and US only
# ---------------------------------------------------------------------------
cases:
  - jurisdiction: UK
    name: Türk Altin İşletmeleri A.Ş v Koza Ltd and Ipek
    citation: "[2026] EWHC 2528 (BP)"
    court: High Court, Insolvency and Companies List
    judge: Thompsell J
    date: 2026-10-06
    bottom_line: >
      A shareholder resolution that merely permits a course of action leaves
      directors bound to consider the company's interests. One that directs them
      does not. On the facts, deadlock alone did not justify winding the company
      up summarily.
    facts: >
      Türk Altin holds all the economic shares in Koza Ltd. Mr Ipek, its sole
      director, holds one share carrying a veto over his own removal and over any
      winding up, and the two sides have been deadlocked since 2016. Türk Altin
      sought summary judgment on a just and equitable winding up petition, and
      alternatively orders compelling Mr Ipek to comply with resolutions passed
      under the Model Article 4 reserve power.
    question: >
      Can a just and equitable winding up be granted summarily, and does a
      shareholder resolution under Article 4 relieve a director of his duty to
      act in the company's interests?
    holding: >
      The judge found the deadlock subsisting and continuing, at [151]. He held
      at [163] that a winding up could not be granted summarily on
      non-compliance with those resolutions alone. On the reserve power he drew
      a line at [198] to [201] between a resolution that permits and one that
      directs: a permission leaves the director's duty to consider the company's
      interests intact, while a direction would absolve him of it.
    why_it_matters: >
      Deadlocked companies are a standing feature of shareholder disputes, and
      the temptation is to treat a veto as self-evidently fatal and ask for a
      winding up on the papers. This says the discretion usually has to be
      exercised at trial. The permission and direction distinction also tells
      you how carefully a reserve power resolution needs drafting.
    background: >
      A company may be wound up where it is just and equitable to do so, a
      jurisdiction most often used when a quasi-partnership has broken down
      beyond repair. It is discretionary, which is why summary disposal sits
      awkwardly with it. Separately, Model Article 4 lets shareholders by special
      resolution direct the directors to take or refrain from an action, a
      reserve power that sits above the board's ordinary authority. How far it
      displaces directors' duties has not been settled.
    source:
      title: Approved judgment — Find Case Law
      url: https://caselaw.nationalarchives.gov.uk/ewhc/bp/2026/2528

# ---------------------------------------------------------------------------
# Both sides of the table
# ---------------------------------------------------------------------------
concepts:
  pairing: >
    The law lets the sale happen before anyone can object because the value
    being sold is precisely the part that disappears while they object.
  law:
    term: The pre-pack administration
    body: >
      A sale of the business negotiated in full before administrators are
      appointed, and completed immediately afterwards. No court hearing, no
      creditor vote, no marketing period. The administrators' duty runs to the
      creditors as a whole, and they must explain themselves after the event
      under Statement of Insolvency Practice 16. Where the buyer is connected to
      the seller, the purchaser must obtain an independent Evaluator's report on
      whether the deal is reasonable, or the administrators need creditor
      approval. The scrutiny is real, but all of it arrives after the business
      has changed hands.
    see_also:
      - SIP 16
      - connected party sale
      - administrators' duties
  finance:
    term: Going concern value against break-up value
    body: >
      What a business fetches running, against what its parts fetch sold
      separately. For an asset-heavy borrower the gap is modest and there is
      time to run a process. For a subscription business it is almost the whole
      of the value, and it decays by the day: customers leave when they read
      that their provider is insolvent, and they do not come back. That is why
      a telecoms pre-pack completes before the market opens, and why creditors
      who wanted an auction are told there was nothing to auction.
    see_also:
      - enterprise value
      - churn
      - liquidation analysis

conditions: >
  Last week's reading does not survive this one. Issue 2 called the repricing
  broad and shallow. Over the seven days to 8 October investment grade tightened
  from 86 basis points to 82 and the high-yield index from 324 to 315, while the
  CCC and lower tier widened from 1,215 to 1,252. The ratio of CCC to the index
  went from 3.75 back to 3.97, close to where it stood on 21 September. The
  market has stopped repricing credit generally and started repricing bad credit
  specifically, which is the shape distress takes before it arrives. The
  ten-year ended at 5.22 per cent, so none of this is rates.

