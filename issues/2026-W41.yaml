# Issue 3. A clean ISO week, 5 to 11 October.
#
# No new large Chapter 11 filed anywhere in the United States in the window,
# which is worth knowing given filings are running well above last year. The
# week's weight was in England, where TalkTalk was sold to BT in the time it
# takes to open a market.

issue: 3
slug: 2026-W41
status: published

date_published: 2026-10-12
period_start: 2026-10-05
period_end: 2026-10-11

headlines:
  - TalkTalk entered administration and was sold to BT the same morning, in a
    pre-pack its largest lender has complained about to ministers and the CMA.
  - Evergrande's liquidators sued two of the founder's former associates for
    HK$19.15bn, and one of them counter-sued the founder two days later.
  - A São Paulo court homologated Grupo Pão de Açúcar's out-of-court plan,
    binding R$4.6bn of unsecured credits on 57 per cent adherence.

# ---------------------------------------------------------------------------
# Situation of the week
# ---------------------------------------------------------------------------
featured:
  jurisdiction: UK
  name: TalkTalk Telecom Group Ltd and subsidiaries
  kind: Administration with an immediate pre-pack sale
  stage: completed
  venue: >
    Business and Property Courts, Insolvency and Companies List, 5 October 2026
  debt: Group borrowings reported at about £1.4bn; sale terms not disclosed
  parties: >
    Alvarez & Marsal as administrators; BT Group as buyer; Ares as the largest
    lender
  body: >
    TalkTalk's holding company and four subsidiaries went into administration on
    the morning of 5 October. By the time London opened, the trading businesses
    had been sold to BT. The announcement and the insolvency were the same
    event.

    That is a pre-pack: a sale negotiated in full before the administrators are
    appointed and executed immediately afterwards, without a court hearing and
    without the creditors being asked first. It is lawful, it is common, and the
    justification is always the same. A broadband company that announces it is
    insolvent and then spends six weeks marketing itself has no customers left
    to sell. Roughly 900 jobs were preserved and 2.5 million customers kept
    their service, which is the case for doing it this way.

    The complication is who bought it. BT is TalkTalk's largest competitor and,
    through Openreach, also the supplier of the network TalkTalk resold.
    Ares, reported to be the largest lender, has complained to ministers, to
    Ofcom and to the Competition and Markets Authority that BT used its position
    as supplier to see off a rival bid. BT says the assets were acquired debt
    free and guides to about £400m of cash impact in its 2027 financial year.

    A pre-pack to a connected or conflicted buyer is the precise case the
    Evaluator regime was built for. Whether it was engaged, and what the
    Evaluator said, is not yet public.
  source:
    title: BT Group has acquired TalkTalk and PlatformX
    url: https://newsroom.bt.com/bt-group-has-acquired-talktalk-and-platformx-ensuring-continuity-of-service-for-millions-of-customers/

