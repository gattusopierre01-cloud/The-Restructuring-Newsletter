    name: Companhia Brasileira de Distribuição (Grupo Pão de Açúcar)
    kind: Recuperação extrajudicial, homologated
    stage: completed
    venue: >
      3ª Vara de Falências e Recuperações Judiciais, São Paulo, 7 October 2026
    debt: R$4.568bn (about $850m) of unsecured credits
    parties: B3-listed; 57.49 per cent creditor adherence
    notable: >
      Brazil's out-of-court route lets a plan agreed with a qualified majority be
      ratified by the court and imposed on the rest, and here a listed grocer
      used it to bind R$4.6bn of unsecured debt on the support of barely more
      than half its creditors. Issue 1 carried Andrade Gutierrez through the same
      procedure three weeks ago. Two large Brazilian names in a month is the
      extrajudicial regime being used at a scale it was not originally built for.
    source:
