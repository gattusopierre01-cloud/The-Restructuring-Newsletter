    kind: Notice of intention to appoint administrators
    stage: negotiating
    venue: Filed 29 October 2026; AlixPartners understood to be lined up
    debt: About 600 stores and roughly 12,000 jobs
    parties: >
      Owned by Gordon Brothers, which bought the chain for £1 in 2025
    notable: >
      Poundland went through a Part 26A restructuring plan last year that
      closed 68 stores over landlord opposition. Fourteen months on, the
      notice of intention buys ten working days of protection while a sale
      runs. CDS Superstores, Fortress and Modella have offered for parts of
      the business, and the managing director has said no acceptable offer was
      found for the whole. Compromising leases does not fix a chain that
      cannot trade profitably in the leases it keeps.
    source:
      title: Poundland to appoint administrators with thousands of jobs at risk (ITV News)
      url: https://www.itv.com/news/2026-10-29/poundland-to-appoint-administrators-with-thousands-of-jobs-at-risk

  - jurisdiction: US
    name: Character Technologies, Inc. (Character.AI)
    kind: Chapter 11 sale, bidding procedures contested
    stage: negotiating
    venue: >
      United States Bankruptcy Court for the District of Delaware, case
      26-11603, petition filed 12 October 2026
    debt: >
      Assets and liabilities each reported in the $50m to $100m band
    parties: Disney Worldwide Services as proposed stalking horse
    notable: >
      The first well known artificial intelligence company to use the chapter
      filed on 12 October, and the case has become an argument about bid
      protections. Thirty-two state attorneys general
      objected that Disney's $700,000 break fee, 3.5 per cent of a $20m cash
      price, is not necessary to preserve estate value, and that since $5.5m
      of Disney's deposit is non-refundable, a rival bid above about $15.2m
      already leaves the estate better off. The company is holding its $21.7m
      floor.
    source:
      title: >
        Character.ai keeps $21.7m bid floor for Disney rivals despite 32
        states (PPC Land)
      url: https://ppc.land/character-ai-keeps-21-7m-bid-floor-for-disney-rivals-despite-32-states/

# ---------------------------------------------------------------------------
# Case notes. UK and US only.
# ---------------------------------------------------------------------------
cases:
  - jurisdiction: UK
    name: Amber Construction Services Ltd v Ilyrian Construction Ltd
    citation: "[2026] EWHC 2603 (BP)"
    court: High Court, Insolvency and Companies List
    judge: Chief Insolvency and Companies Court Judge Briggs
    date: 2026-10-16
    bottom_line: >
      An interim payment claim under a JCT style subcontract can become
      statute barred on its own, without waiting for the final account. A
      cross-claim can defeat a petition even where it has never been
      particularised or sued on.
    facts: >
      Ilyrian served two statutory demands for roofing works at two sites, for
      £27,119.90 and £39,329.00. Amber applied for final injunctions
      restraining winding up petitions, relying on a defective payment
      application, limitation, and a cross-claim for loss and expense of
      £47,728.01.
    question: >
      Were the debts genuinely disputed on substantial grounds, and did a
      cross-claim that had never been litigated equal or exceed them?
    holding: >
      Both petitions were restrained. The first application was invalid for
      failing mandatory requirements in clause 6.4, so no sum fell due. In the
      alternative the claim was statute barred, because each interim payment
      accrues as a separate debt and a statutory demand does not stop
      limitation. The cross-claim was genuine and substantial despite thin
      particulars, and it exceeded the second debt.
    why_it_matters: >
      Two practical points. A payment application that misses contractual
      formalities may never create a debt at all, which removes the foundation
      for a petition. And a creditor who sits on a cross-claim for six years
      does not lose it: the judge treated the inaction as a stand off between
      the parties rather than as evidence the claim was hollow.
    background: >
      A company facing a winding up petition can ask the court to restrain its
      presentation where the debt is genuinely disputed on substantial grounds,
      or where the company has a genuine and substantial cross-claim equal to
      or exceeding the debt. The petition is a collective remedy, not a debt
      collection tool, so a disputed sum belongs in ordinary litigation. The
      court does not try the dispute on the application; it asks whether the
      case would survive being probed and turned over.
    source:
      title: Approved judgment, Find Case Law
      url: https://caselaw.nationalarchives.gov.uk/ewhc/bp/2026/2603

# ---------------------------------------------------------------------------
# Both sides of the table
# ---------------------------------------------------------------------------
concepts:
  pairing: >
    A prepack only works when everyone already agrees where the value breaks,
    which is why the negotiating finishes before the filing and the filing
    merely records it.
  law:
    term: The prepackaged Chapter 11
    body: >
      Votes are solicited before the petition is filed, so the case arrives
      already carrying the majorities it needs. The debtor files its plan and
      disclosure statement on day one and asks for one combined hearing
      rather than the usual two. It is fast, which protects trade terms and
      customers, and cheap set against a litigated case. What it cannot do is
      bind a class nobody brought along beforehand, so the method depends on
      the negotiation being finished before anyone walks into court. Getty
      solicited on 20 October and filed on the 21st.
  finance:
    term: Where the value breaks
    body: >
      Run the enterprise value down the capital structure until you reach the
      class that is only partly paid. Everything above it is made whole,
      everything below gets nothing, and that class is the fulcrum: the one
      that converts into the equity, or negotiates hardest over the terms. In
      Getty the secured lenders and the revolver are whole, the unsecured
      notes recover in the low sixties, and the shares are cancelled. The
      value breaks in the unsecured notes, which is why their holders signed
      the support agreement.
    see_also:
      - fulcrum security
      - absolute priority
      - restructuring support agreement

conditions: >
  Three weeks of widening, and this time it reached the top of the stack. From
  12 to 29 October investment grade went from 83 basis points to 89, high
  yield from 311 to 326, and the CCC and lower tier from 1,253 to 1,325. All
  three peaked on 23 October and have since given back roughly half. The
  detail worth keeping is proportion rather than size: investment grade
  widened about seven per cent over the three weeks, against roughly five per
  cent for high yield. Issue 3 described a market repricing bad credit
  specifically. It is now repricing good credit too, which is slower and
  broader.

