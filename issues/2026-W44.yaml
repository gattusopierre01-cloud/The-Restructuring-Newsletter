# Issue 4. A three week window, 12 to 31 October, because issue 3's successor
# was drafted and never sent. Nothing from the intervening weeks is lost: the
# Character.AI filing of 12 October reappears here in the state it has since
# reached, which is a fight about bid protections rather than a filing.
#
# The spine of the issue is priority. Getty cancels its shareholders and sells
# the new equity to the same people, Poundland tests what a restructuring plan
# actually bought fourteen months ago, and thirty-two states argue about what a
# break fee is for.

issue: 4
slug: 2026-W44
status: published

date_published: 2026-11-02
period_start: 2026-10-12
period_end: 2026-10-31

headlines:
  - Getty Images filed a prepackaged Chapter 11 in Delaware to shed more than
    $500m of debt, cancelling its shareholders and selling the new equity to
    them.
  - Poundland filed a notice of intention to appoint administrators, putting
    about 600 stores and 12,000 jobs in play fourteen months after a
    restructuring plan.
  - Thirty-two state attorneys general objected to Character.AI's bid
    protections, arguing they are not necessary to preserve the value of the
    estate.

# ---------------------------------------------------------------------------
# Situation of the week
# ---------------------------------------------------------------------------
featured:
  jurisdiction: US
  name: Getty Images Holdings, Inc. and six subsidiaries
  kind: Prepackaged Chapter 11
  stage: filed
  venue: >
    United States Bankruptcy Court for the District of Delaware, case
    26-11643, petitions filed 21 October 2026, Judge Stickles
  debt: >
    About $1.46bn of funded debt; the plan eliminates more than $500m of it
  parties: >
    Getty family and Koch Equity Development affiliates as plan sponsors;
    Guggenheim Securities; Kroll as claims agent
  body: >
    Getty Images Holdings and six subsidiaries filed prepackaged Chapter 11
    petitions in Delaware on 21 October, one day after they began soliciting
    votes. The foreign subsidiaries, which generate about 44 per cent of
    revenue, did not file.

    How the group arrived there matters as much as where it landed. Getty
    agreed to merge with Shutterstock in January 2025 in a deal worth about
    $3.7bn, and that merger was also the answer to its balance sheet. The
    Competition and Markets Authority's final report in May 2026 required the
    divestiture of Shutterstock's editorial business, the board declined a
    supervised sale, and the agreement was terminated in July at a cost of
    more than $100m in fees. The deleveraging went with it.

    The plan itself is a clean illustration of priority. Secured lenders and
    revolver lenders are made whole in new paper. Unsecured noteholders take
    about $170.2m of cash against $270m of principal, a recovery in the low
    sixties. Existing shareholders receive nothing and their shares are
    cancelled, the stock having already moved from the New York Stock Exchange
    to the over the counter market.

    The sponsors who end up owning the company are the Getty family and Koch
    affiliates, who were also among the shareholders being cancelled. They are
    committing about $433m of new money for all of the new equity and funding
    the $143m debtor in possession facility. That is not a contradiction. Old
    equity goes because the value does not reach it; new equity is bought
    because someone pays fresh money for it. It is also why the company
    appointed independent directors to special committees, and why the plan
    will be tested at a combined hearing listed for 14 December.
  source:
    title: Getty Images Holdings, Inc., Form 8-K dated 23 October 2026
    url: https://www.sec.gov/Archives/edgar/data/0001898496/000121390026112265/ea0309581-8k_getty.htm

