name: Publish

on:
  push:
    branches: [main]
    paths:
      - "issues/**"
      - "templates/**"
      - "docs/**"
      - "pipeline/**"
      - "config/**"
      - "mkdocs.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Typst
        env:
          TYPST_VERSION: v0.15.1
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
          tar -xf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Check the issues against the editorial rules
        run: python -m pipeline.validate

      - name: Render the PDFs
        run: python -m pipeline.render_pdf

      - name: Generate the site pages
        run: python -m pipeline.render_site

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
