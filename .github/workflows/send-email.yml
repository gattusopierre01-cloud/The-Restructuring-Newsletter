name: Send email

# Deliberately manual. Sending is the one step that cannot be undone, so it
# asks a human to pick the issue and press the button.
#
# Once a few issues have gone out and you trust the pipeline, this can be
# triggered from publish.yml instead — see README.md, "Turning on automatic
# sending".

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue slug, e.g. 2026-W40"
        required: true
        type: string
      confirm:
        description: 'Type "send" to confirm — this goes to every subscriber'
        required: true
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: ${{ inputs.confirm != 'send' }}
        run: |
          echo "::error::Confirmation was '${{ inputs.confirm }}', expected 'send'."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the issue against the editorial rules
        run: python -m pipeline.validate "issues/${{ inputs.issue }}.yaml"

      - name: Preview what will be sent
        run: python -m pipeline.render_email "issues/${{ inputs.issue }}.yaml"

      - name: Send
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python -m pipeline.render_email "issues/${{ inputs.issue }}.yaml" --send
